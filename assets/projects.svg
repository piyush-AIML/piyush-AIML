<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 420" width="100%" role="img" aria-labelledby="pj-title pj-desc">
  <title id="pj-title">Projects — three real builds, two open slots</title>
  <desc id="pj-desc">Lab cards for the work: VLM-1 (building, magenta), web-host (active, cyan) and this profile (deployed, green), each with a state chip and a pulsing status dot. Two dashed slots wait empty for the next builds — no invented projects.</desc>

  <rect width="1000" height="420" fill="#000000"/>

  <text x="40" y="40" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SF Mono',Menlo,monospace" font-size="15" letter-spacing="3" fill="#00F7FF">// PROJECTS</text>
  <text x="960" y="40" text-anchor="end" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SF Mono',Menlo,monospace" font-size="10" letter-spacing="2" fill="#3A4A63">REAL BUILDS ONLY · EMPTY SLOTS STAY EMPTY</text>

  <g font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SF Mono',Menlo,monospace">

    <!-- card: VLM-1 -->
    <g>
      <circle cx="56" cy="112" r="4" fill="#E879F9">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <rect x="40" y="70" width="920" height="84" rx="8" fill="#070A12" stroke="#16243C"/>
      <rect x="40" y="70" width="4" height="84" rx="2" fill="#E879F9">
        <animate attributeName="opacity" values="0.55;1;0.55" dur="2.2s" repeatCount="indefinite"/>
      </rect>
      <text x="64" y="97" font-size="14" font-weight="700" fill="#E879F9">VLM-1</text>
      <text x="64" y="121" font-size="10.5" fill="#5A6B85">vision-language model built from scratch —</text>
      <text x="64" y="137" font-size="10.5" fill="#5A6B85">ViT + Q-Former, no assembly from libraries</text>
      <rect x="330" y="84" width="86" height="20" rx="10" fill="#E879F9" fill-opacity="0.15" stroke="#E879F9" stroke-opacity="0.65"/>
      <text x="373" y="98" text-anchor="middle" font-size="9.5" letter-spacing="1.5" fill="#E879F9">BUILDING</text>
      <g font-size="9.5">
        <rect x="330" y="110" width="64" height="18" rx="9" fill="#E879F9" fill-opacity="0.1" stroke="#E879F9" stroke-opacity="0.35"/><text x="362" y="123" text-anchor="middle" fill="#F0ABFC">Python</text>
        <rect x="402" y="110" width="70" height="18" rx="9" fill="#E879F9" fill-opacity="0.1" stroke="#E879F9" stroke-opacity="0.35"/><text x="437" y="123" text-anchor="middle" fill="#F0ABFC">PyTorch</text>
        <rect x="480" y="110" width="66" height="18" rx="9" fill="#E879F9" fill-opacity="0.1" stroke="#E879F9" stroke-opacity="0.35"/><text x="513" y="123" text-anchor="middle" fill="#F0ABFC">training</text>
      </g>
      <text x="944" y="101" text-anchor="end" font-size="10" fill="#3A4A63">github.com/piyush-AIML/VLM-1</text>
    </g>

    <!-- card: web-host -->
    <g>
      <circle cx="56" cy="200" r="4" fill="#00F7FF">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.8s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <rect x="40" y="158" width="920" height="84" rx="8" fill="#070A12" stroke="#16243C"/>
      <rect x="40" y="158" width="4" height="84" rx="2" fill="#00F7FF">
        <animate attributeName="opacity" values="0.55;1;0.55" dur="2.8s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
      <text x="64" y="185" font-size="14" font-weight="700" fill="#00F7FF">web-host</text>
      <text x="64" y="209" font-size="10.5" fill="#5A6B85">small hosting experiment —</text>
      <text x="64" y="225" font-size="10.5" fill="#5A6B85">one box, multiple sites, learning to keep it alive</text>
      <rect x="330" y="172" width="78" height="20" rx="10" fill="#00F7FF" fill-opacity="0.12" stroke="#00F7FF" stroke-opacity="0.6"/>
      <text x="369" y="186" text-anchor="middle" font-size="9.5" letter-spacing="1.5" fill="#00F7FF">ACTIVE</text>
      <g font-size="9.5">
        <rect x="330" y="198" width="56" height="18" rx="9" fill="#00F7FF" fill-opacity="0.1" stroke="#00F7FF" stroke-opacity="0.35"/><text x="358" y="211" text-anchor="middle" fill="#7FCDD6">HTML</text>
        <rect x="394" y="198" width="64" height="18" rx="9" fill="#00F7FF" fill-opacity="0.1" stroke="#00F7FF" stroke-opacity="0.35"/><text x="426" y="211" text-anchor="middle" fill="#7FCDD6">nginx</text>
      </g>
      <text x="944" y="189" text-anchor="end" font-size="10" fill="#3A4A63">github.com/piyush-AIML/web-host</text>
    </g>

    <!-- card: this profile -->
    <g>
      <circle cx="56" cy="288" r="4" fill="#7BE0B0">
        <animate attributeName="opacity" values="1;0.25;1" dur="3.4s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <rect x="40" y="246" width="920" height="84" rx="8" fill="#070A12" stroke="#16243C"/>
      <rect x="40" y="246" width="4" height="84" rx="2" fill="#7BE0B0">
        <animate attributeName="opacity" values="0.55;1;0.55" dur="3.4s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
      <text x="64" y="273" font-size="14" font-weight="700" fill="#7BE0B0">this profile</text>
      <text x="64" y="297" font-size="10.5" fill="#5A6B85">the artifact you're reading —</text>
      <text x="64" y="313" font-size="10.5" fill="#5A6B85">hand-built SVG, telemetry regenerated daily</text>
      <rect x="330" y="260" width="92" height="20" rx="10" fill="#7BE0B0" fill-opacity="0.12" stroke="#7BE0B0" stroke-opacity="0.55"/>
      <text x="376" y="274" text-anchor="middle" font-size="9.5" letter-spacing="1.5" fill="#7BE0B0">DEPLOYED</text>
      <g font-size="9.5">
        <rect x="330" y="286" width="74" height="18" rx="9" fill="#7BE0B0" fill-opacity="0.1" stroke="#7BE0B0" stroke-opacity="0.35"/><text x="367" y="299" text-anchor="middle" fill="#A9E8CB">Markdown</text>
        <rect x="412" y="286" width="46" height="18" rx="9" fill="#7BE0B0" fill-opacity="0.1" stroke="#7BE0B0" stroke-opacity="0.35"/><text x="435" y="299" text-anchor="middle" fill="#A9E8CB">SVG</text>
        <rect x="466" y="286" width="74" height="18" rx="9" fill="#7BE0B0" fill-opacity="0.1" stroke="#7BE0B0" stroke-opacity="0.35"/><text x="503" y="299" text-anchor="middle" fill="#A9E8CB">Actions</text>
      </g>
      <text x="944" y="277" text-anchor="end" font-size="10" fill="#3A4A63">github.com/piyush-AIML/piyush-AIML</text>
    </g>

    <!-- empty slots -->
    <g font-size="10.5" letter-spacing="2">
      <rect x="40" y="348" width="452" height="52" rx="8" fill="none" stroke="#3A4A63" stroke-width="1.5" stroke-dasharray="7 6">
        <animate attributeName="stroke-dashoffset" values="0;-26" dur="3s" repeatCount="indefinite"/>
      </rect>
      <text x="266" y="371" text-anchor="middle" fill="#5A6B85">PROJECT SLOT</text>
      <text x="266" y="389" text-anchor="middle" font-size="9" letter-spacing="2" fill="#3A4A63">// AWAITING BUILD</text>

      <rect x="508" y="348" width="452" height="52" rx="8" fill="none" stroke="#3A4A63" stroke-width="1.5" stroke-dasharray="7 6">
        <animate attributeName="stroke-dashoffset" values="-13;-39" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
      <text x="734" y="371" text-anchor="middle" fill="#5A6B85">PROJECT SLOT</text>
      <text x="734" y="389" text-anchor="middle" font-size="9" letter-spacing="2" fill="#3A4A63">// AWAITING BUILD</text>
    </g>
  </g>

  <text x="960" y="416" text-anchor="end" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SF Mono',Menlo,monospace" font-size="9" letter-spacing="1" fill="#2A3A55">empty space is where the next build lands</text>
</svg>
