      <rect x="40" y="220" width="150" height="64" rx="8" fill="#0A1120" stroke="#00F7FF" stroke-opacity="0.4">
        <animate attributeName="stroke-opacity" values="0.3;0.55;0.3" dur="7.5s" begin="1s" repeatCount="indefinite"/>
      </rect>
      <text x="54" y="242" font-size="11.5" font-weight="600" fill="#EAF6FF">DATA MODELING</text>
      <text x="54" y="258" font-size="9" letter-spacing="1.5" fill="#00F7FF">ACTIVE</text>
      <text x="54" y="272" font-size="8" fill="#4A5B78">SQL · schemas</text>
    </g>

