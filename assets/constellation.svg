<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 560" width="100%" role="img" aria-labelledby="con-title con-desc">
  <title id="con-title">Learning constellation — Piyush's skill tree</title>
  <desc id="con-desc">A two-tier star map of real skills. Six lit hubs are the working domains — Python backend, system design, LLMs, AI engineering, fine-tuning, indoor navigation. Each hub has satellites: the sub-skills that make up its full tree. Active domains glow cyan, in-flight work pulses violet and magenta, exploring stays dim, and unmapped sky is honestly drawn as unmapped.</desc>

  <defs>
    <radialGradient id="skyGlow" cx="0.55" cy="0.5" r="0.85">
      <stop offset="0%" stop-color="#0A1120"/>
      <stop offset="100%" stop-color="#05070D"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00F7FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlowM" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#E879F9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#E879F9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="560" fill="url(#skyGlow)"/>

  <!-- sky: static dust, a few slow twinkles -->
  <g fill="#1B2944">
    <circle cx="90" cy="80" r="1.2"/><circle cx="180" cy="160" r="0.9"/><circle cx="330" cy="60" r="1.3"/>
    <circle cx="470" cy="220" r="1"/><circle cx="560" cy="160" r="1.2"/><circle cx="640" cy="240" r="1.1"/>
    <circle cx="720" cy="60" r="1.3"/><circle cx="860" cy="250" r="0.9"/><circle cx="950" cy="100" r="1.1"/>
    <circle cx="60" cy="300" r="1"/><circle cx="350" cy="380" r="1.2"/><circle cx="160" cy="560" r="0.9"/>
    <circle cx="580" cy="330" r="1.1"/><circle cx="900" cy="560" r="1"/><circle cx="60" cy="430" r="1.2"/>
    <circle cx="330" cy="230" r="1"/><circle cx="760" cy="560" r="1.2"/><circle cx="940" cy="180" r="0.9"/>
  </g>
  <g fill="#2A3D63">
    <circle cx="350" cy="60" r="1.4"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="250" r="1.4"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="10s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="300" r="1.4"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="9s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="80" r="1.4"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="11s" begin="3.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- unmapped sky: an honest dark region -->
  <g>
    <circle cx="925" cy="260" r="55" fill="none" stroke="#16243C" stroke-width="1" stroke-dasharray="2 6"/>
    <text x="925" y="256" text-anchor="middle" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SF Mono',Menlo,monospace" font-size="10" letter-spacing="2" fill="#3A4A63">UNMAPPED</text>
    <text x="925" y="270" text-anchor="middle" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SF Mono',Menlo,monospace" font-size="8" letter-spacing="1" fill="#2A3A55">future domains</text>
  </g>

  <!-- spine: the learning arc, hub to hub -->
  <g fill="none">
    <line x1="200" y1="150" x2="500" y2="100" stroke="#00F7FF" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="500" y1="100" x2="500" y2="470" stroke="#7C3AED" stroke-width="1.8" stroke-opacity="0.4"/>
    <line x1="500" y1="470" x2="240" y2="440" stroke="#7C3AED" stroke-width="2" stroke-opacity="0.55"/>
    <line x1="240" y1="440" x2="800" y2="140" stroke="#E879F9" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="790" y1="440" x2="500" y2="470" stroke="#7C3AED" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3 5"/>
  </g>

  <!-- satellite hairlines -->
  <g stroke="#1B2944" stroke-width="1" fill="none">
    <line x1="200" y1="150" x2="100" y2="70"/>
    <line x1="200" y1="150" x2="60" y2="190"/>
    <line x1="200" y1="150" x2="230" y2="60"/>
    <line x1="200" y1="150" x2="300" y2="215"/>
    <line x1="500" y1="100" x2="410" y2="20"/>
    <line x1="500" y1="100" x2="600" y2="25"/>
    <line x1="500" y1="100" x2="640" y2="120"/>
    <line x1="500" y1="100" x2="420" y2="140"/>
    <line x1="800" y1="140" x2="900" y2="60"/>
    <line x1="800" y1="140" x2="925" y2="170"/>
    <line x1="800" y1="140" x2="705" y2="55"/>
    <line x1="240" y1="440" x2="130" y2="380"/>
    <line x1="240" y1="440" x2="90" y2="500"/>
    <line x1="240" y1="440" x2="330" y2="515"/>
    <line x1="500" y1="470" x2="395" y2="525"/>
    <line x1="500" y1="470" x2="615" y2="525"/>
    <line x1="500" y1="470" x2="555" y2="540"/>
    <line x1="790" y1="440" x2="895" y2="355"/>
    <line x1="790" y1="440" x2="920" y2="455"/>
    <line x1="790" y1="440" x2="690" y2="530"/>
    <line x1="790" y1="440" x2="655" y2="390"/>
  </g>

  <!-- pulse traveling the whole learning arc -->
  <g>
    <circle r="2.4" fill="#E879F9">
      <animateMotion path="M200,150 L500,100 L500,470 L240,440 L800,140" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.15;0.85;1" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.2" fill="#00F7FF">
      <animateMotion path="M790,440 L500,470" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.2;0.85;1" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================= HUBS ================= -->
  <g font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SF Mono',Menlo,monospace">

    <!-- PYTHON · BACKEND — ACTIVE -->
    <g>
      <circle cx="200" cy="150" r="15" fill="url(#nodeGlow)"/>
      <circle cx="200" cy="150" r="6" fill="#00F7FF"><animate attributeName="r" values="6;7.4;6" dur="4.5s" repeatCount="indefinite"/></circle>
      <text x="200" y="168" text-anchor="middle" font-size="12" letter-spacing="2" fill="#EAF6FF">PYTHON · BACKEND</text>
      <text x="200" y="182" text-anchor="middle" font-size="10" letter-spacing="2" fill="#00F7FF">ACTIVE</text>
    </g>

    <!-- SYSTEM DESIGN — ACTIVE -->
    <g>
      <circle cx="500" cy="100" r="15" fill="url(#nodeGlow)"/>
      <circle cx="500" cy="100" r="6" fill="#00F7FF"><animate attributeName="r" values="6;7.4;6" dur="5s" begin="0.5s" repeatCount="indefinite"/></circle>
      <text x="500" y="118" text-anchor="middle" font-size="12" letter-spacing="2" fill="#EAF6FF">SYSTEM DESIGN</text>
      <text x="500" y="132" text-anchor="middle" font-size="10" letter-spacing="2" fill="#00F7FF">ACTIVE</text>
    </g>

    <!-- LLMS — ACTIVE -->
    <g>
      <circle cx="800" cy="140" r="15" fill="url(#nodeGlow)"/>
      <circle cx="800" cy="140" r="6" fill="#00F7FF"><animate attributeName="r" values="6;7.4;6" dur="4.8s" begin="1s" repeatCount="indefinite"/></circle>
      <text x="800" y="158" text-anchor="middle" font-size="12" letter-spacing="2" fill="#EAF6FF">LLMS</text>
      <text x="800" y="172" text-anchor="middle" font-size="10" letter-spacing="2" fill="#00F7FF">ACTIVE</text>
    </g>

    <!-- FINE-TUNING — BUILDING -->
    <g>
      <circle cx="240" cy="440" r="17" fill="url(#nodeGlowM)"/>
      <circle cx="240" cy="440" r="6" fill="#E879F9"><animate attributeName="r" values="6;7.4;6" dur="4s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="240" cy="440" r="14" fill="none" stroke="#E879F9" stroke-width="1" stroke-opacity="0.6">
        <animate attributeName="r" values="12;26" dur="4s" begin="0.3s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.45;0" dur="4s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <text x="240" y="458" text-anchor="middle" font-size="12" letter-spacing="2" fill="#EAF6FF">FINE-TUNING</text>
      <text x="240" y="472" text-anchor="middle" font-size="10" letter-spacing="2" fill="#E879F9">BUILDING</text>
    </g>

    <!-- AI ENGINEERING — LEARNING -->
    <g>
      <circle cx="500" cy="470" r="15" fill="url(#nodeGlowV)"/>
      <circle cx="500" cy="470" r="5.5" fill="#7C3AED"><animate attributeName="r" values="5.5;6.8;5.5" dur="3.8s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="500" cy="470" r="13" fill="none" stroke="#7C3AED" stroke-width="1" stroke-dasharray="4 5" stroke-opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="0 500 470" to="360 500 470" dur="40s" repeatCount="indefinite"/>
      </circle>
      <text x="500" y="488" text-anchor="middle" font-size="12" letter-spacing="2" fill="#EAF6FF">AI ENGINEERING</text>
      <text x="500" y="502" text-anchor="middle" font-size="10" letter-spacing="2" fill="#7C3AED">LEARNING</text>
    </g>

    <!-- INDOOR NAVIGATION — ACTIVE -->
    <g>
      <circle cx="790" cy="440" r="15" fill="url(#nodeGlow)"/>
      <circle cx="790" cy="440" r="6" fill="#00F7FF"><animate attributeName="r" values="6;7.4;6" dur="4.6s" begin="1.4s" repeatCount="indefinite"/></circle>
      <text x="790" y="458" text-anchor="middle" font-size="12" letter-spacing="2" fill="#EAF6FF">INDOOR NAVIGATION</text>
      <text x="790" y="472" text-anchor="middle" font-size="10" letter-spacing="2" fill="#00F7FF">ACTIVE</text>
    </g>
  </g>

  <!-- ================= SATELLITES ================= -->
  <g font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SF Mono',Menlo,monospace" font-size="9.5" letter-spacing="1.5" fill="#5A6B85">
    <!-- backend -->
    <circle cx="100" cy="70" r="3" fill="#00F7FF" fill-opacity="0.55"/><text x="100" y="84" text-anchor="middle">FASTAPI</text>
    <circle cx="60" cy="190" r="3" fill="#00F7FF" fill-opacity="0.55"/><text x="60" y="204" text-anchor="middle">ASYNC · REST</text>
    <circle cx="230" cy="60" r="3" fill="#00F7FF" fill-opacity="0.55"/><text x="230" y="74" text-anchor="middle">DATA · STORAGE</text>
    <circle cx="300" cy="215" r="3" fill="#3A4A63"/><text x="300" y="229" text-anchor="middle">DEPLOY · OPS</text>
    <!-- system design -->
    <circle cx="410" cy="20" r="3" fill="#00F7FF" fill-opacity="0.45"/><text x="410" y="34" text-anchor="middle">DISTRIBUTED</text>
    <circle cx="600" cy="25" r="3" fill="#00F7FF" fill-opacity="0.45"/><text x="600" y="39" text-anchor="middle">SCALABILITY</text>
    <circle cx="640" cy="120" r="3" fill="#00F7FF" fill-opacity="0.45"/><text x="640" y="134" text-anchor="middle">DATA MODELING</text>
    <circle cx="420" cy="140" r="3" fill="#00F7FF" fill-opacity="0.45"/><text x="420" y="154" text-anchor="middle">QUEUES · CACHING</text>
    <!-- llms -->
    <circle cx="900" cy="60" r="3" fill="#7C3AED" fill-opacity="0.6"/><text x="900" y="74" text-anchor="middle">RAG · EMBEDDINGS</text>
    <circle cx="925" cy="170" r="3" fill="#3A4A63"/><text x="925" y="184" text-anchor="middle">AGENTS · TOOLING</text>
    <circle cx="705" cy="55" r="3" fill="#7C3AED" fill-opacity="0.6"/><text x="705" y="69" text-anchor="middle">PROMPT · CONTEXT</text>
    <!-- fine-tuning -->
    <circle cx="130" cy="380" r="3" fill="#E879F9" fill-opacity="0.5"/><text x="130" y="394" text-anchor="middle">PEFT · ADAPTERS</text>
    <circle cx="90" cy="500" r="3" fill="#E879F9" fill-opacity="0.5"/><text x="90" y="514" text-anchor="middle">DATASET CURATION</text>
    <circle cx="330" cy="515" r="3" fill="#E879F9" fill-opacity="0.5"/><text x="330" y="529" text-anchor="middle">EVAL · BENCHMARKS</text>
    <!-- ai engineering -->
    <circle cx="395" cy="525" r="3" fill="#7C3AED" fill-opacity="0.6"/><text x="395" y="539" text-anchor="middle">ML PIPELINES</text>
    <circle cx="615" cy="525" r="3" fill="#7C3AED" fill-opacity="0.6"/><text x="615" y="539" text-anchor="middle">SERVING · EVAL</text>
    <circle cx="555" cy="540" r="3" fill="#3A4A63"/><text x="555" y="554" text-anchor="middle">MLOPS · TRACKING</text>
    <!-- indoor navigation -->
    <circle cx="895" cy="355" r="3" fill="#00F7FF" fill-opacity="0.45"/><text x="895" y="369" text-anchor="middle">SLAM · LOCALIZATION</text>
    <circle cx="920" cy="455" r="3" fill="#00F7FF" fill-opacity="0.45"/><text x="920" y="469" text-anchor="middle">SENSOR FUSION</text>
    <circle cx="690" cy="530" r="3" fill="#00F7FF" fill-opacity="0.45"/><text x="690" y="544" text-anchor="middle">PATH PLANNING</text>
    <circle cx="655" cy="390" r="3" fill="#00F7FF" fill-opacity="0.45"/><text x="655" y="404" text-anchor="middle">MAPPING</text>
  </g>

  <!-- header -->
  <text x="40" y="40" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SF Mono',Menlo,monospace" font-size="14" letter-spacing="3" fill="#5A6B85">// LEARNING CONSTELLATION</text>
  <text x="960" y="40" text-anchor="end" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SF Mono',Menlo,monospace" font-size="10" letter-spacing="2" fill="#3A4A63">6 DOMAINS · 20 SATELLITES · HONEST MAP</text>

  <!-- legend -->
  <g font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2">
    <rect x="700" y="512" width="10" height="10" fill="#00F7FF"/>
    <text x="720" y="521" fill="#5A6B85">ACTIVE</text>
    <rect x="780" y="512" width="10" height="10" fill="#7C3AED"/>
    <text x="800" y="521" fill="#5A6B85">LEARNING</text>
    <rect x="870" y="512" width="10" height="10" fill="#E879F9"/>
    <text x="890" y="521" fill="#5A6B85">BUILDING</text>
  </g>
</svg>
