<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 560" width="100%" role="img" aria-labelledby="con-title con-desc">
  <title id="con-title">Skill graph — real-world workflow architecture</title>
  <desc id="con-desc">Piyush's skills as a working system: module boxes (Python backend, system design, AI engineering, fine-tuning, LLMs, MLOps) connected by directed workflow arrows — specs, features, training loop, checkpoints, ship, deploy, inference back to the API, monitoring — plus the indoor-navigation subsystem as its own pipeline (SLAM to sensor fusion to mapping to path planning). Fast async pulses travel the edges continuously.</desc>

  <defs>
    <radialGradient id="skyGlow" cx="0.5" cy="0.45" r="0.9">
      <stop offset="0%" stop-color="#0A1120"/>
      <stop offset="100%" stop-color="#05070D"/>
    </radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2A3D63"/>
    </marker>
  </defs>

  <rect width="1000" height="560" fill="url(#skyGlow)"/>

  <!-- faint sky dust -->
  <g fill="#15213A">
    <circle cx="90" cy="180" r="1"/><circle cx="880" cy="60" r="1"/><circle cx="620" cy="320" r="1"/>
    <circle cx="300" cy="420" r="1"/><circle cx="960" cy="250" r="1"/><circle cx="60" cy="360" r="1"/>
    <circle cx="760" cy="110" r="1"/><circle cx="540" cy="500" r="1"/><circle cx="240" cy="330" r="1"/>
  </g>
  <g fill="#2A3D63">
    <circle cx="880" cy="60" r="1.3"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="420" r="1.3"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="11s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="320" r="1.3"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="8s" begin="4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ============ WORKFLOW EDGES (directed) ============ -->
  <g fill="none" stroke="#2A3D63" stroke-width="1.3" marker-end="url(#arr)">
    <path d="M190,120 L250,182"/>                                   <!-- design → backend: specs -->
    <path d="M115,284 C200,320 400,310 460,260"/>                   <!-- data → fine-tuning: features -->
    <path d="M400,182 C425,160 440,130 460,112"/>                   <!-- backend → ml: feeds -->
    <path d="M535,144 L535,215"/>                                   <!-- ml → fine-tuning: train loop -->
    <path d="M535,279 L535,350"/>                                   <!-- fine-tuning → eval: checkpoints -->
    <path d="M535,414 C600,430 680,430 745,340"/>                   <!-- eval → mlops: ship -->
    <path d="M745,340 L745,214"/>                                   <!-- mlops → llms: deploys -->
    <path d="M670,182 C620,172 470,152 400,158"/>                   <!-- llms → backend: inference loop -->
    <path d="M670,372 C640,300 630,180 610,112"/>                   <!-- mlops → ml: monitors -->
    <!-- indoor navigation pipeline -->
    <path d="M172,511 L194,511"/>                                   <!-- slam → sensor fusion -->
    <path d="M322,511 L344,511"/>                                   <!-- sensor fusion → mapping -->
    <path d="M472,511 L494,511"/>                                   <!-- mapping → path planning -->
    <path d="M408,484 L408,420 L190,420 L190,252"/>                 <!-- nav → data modeling: nav data -->
  </g>

  <!-- edge labels -->
  <g font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SF Mono',Menlo,monospace" font-size="8.5" letter-spacing="1" fill="#3A4A63">
    <text x="216" y="142">specs</text>
    <text x="290" y="300">features</text>
    <text x="418" y="138">feeds</text>
    <text x="545" y="176">train loop</text>
    <text x="545" y="312">checkpoints</text>
    <text x="640" y="438">ship</text>
    <text x="755" y="270">deploys</text>
    <text x="640" y="168">infer → API</text>
    <text x="648" y="250">monitors</text>
    <text x="300" y="412">nav data</text>
    <text x="180" y="501">pose</text>
    <text x="330" y="501">fused</text>
    <text x="480" y="501">map</text>
  </g>

  <!-- ============ ASYNC PULSES — 13 moving points, all out of phase ============ -->
  <g>
    <circle r="2.4" fill="#00F7FF">
      <animateMotion path="M190,120 L250,182" dur="4.2s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1;0.35;0.85;1" dur="4.2s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.2" fill="#00F7FF">
      <animateMotion path="M115,284 C200,320 400,310 460,260" dur="6s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1;0.35;0.85;1" dur="6s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.2" fill="#00F7FF">
      <animateMotion path="M400,182 C425,160 440,130 460,112" dur="3.8s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1;0.35;0.85;1" dur="3.8s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.6" fill="#E879F9">
      <animateMotion path="M535,144 L535,215" dur="4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1;0.35;0.85;1" dur="4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.6" fill="#E879F9">
      <animateMotion path="M535,144 L535,215" dur="4s" begin="2.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1;0.35;0.85;1" dur="4s" begin="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.4" fill="#E879F9">
      <animateMotion path="M535,279 L535,350" dur="3.6s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1;0.35;0.85;1" dur="3.6s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.2" fill="#7C3AED">
      <animateMotion path="M535,414 C600,430 680,430 745,340" dur="5.2s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1;0.35;0.85;1" dur="5.2s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.2" fill="#7C3AED">
      <animateMotion path="M745,340 L745,214" dur="4.4s" begin="2.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1;0.35;0.85;1" dur="4.4s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.2" fill="#00F7FF">
      <animateMotion path="M670,182 C620,172 470,152 400,158" dur="5.8s" begin="1.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1;0.35;0.85;1" dur="5.8s" begin="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#5A6B85">
      <animateMotion path="M670,372 C640,300 630,180 610,112" dur="6.4s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1;0.35;0.85;1" dur="6.4s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.4" fill="#00F7FF">
      <animateMotion path="M172,511 L194,511" dur="3.2s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1;0.35;0.85;1" dur="3.2s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.4" fill="#00F7FF">
      <animateMotion path="M322,511 L344,511" dur="2.8s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1;0.35;0.85;1" dur="2.8s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.4" fill="#00F7FF">
      <animateMotion path="M472,511 L494,511" dur="3.4s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1;0.35;0.85;1" dur="3.4s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#00F7FF" fill-opacity="0.6">
      <animateMotion path="M408,484 L408,420 L190,420 L190,252" dur="7s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1;0.35;0.85;1" dur="7s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ MODULES ============ -->
  <g font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SF Mono',Menlo,monospace">

    <!-- SYSTEM DESIGN · ACTIVE -->
    <g>
      <rect x="40" y="80" width="150" height="64" rx="8" fill="#0A1120" stroke="#00F7FF" stroke-opacity="0.4">
        <animate attributeName="stroke-opacity" values="0.3;0.55;0.3" dur="7s" repeatCount="indefinite"/>
      </rect>
      <text x="54" y="102" font-size="11.5" font-weight="600" fill="#EAF6FF">SYSTEM DESIGN</text>
      <text x="54" y="118" font-size="9" letter-spacing="1.5" fill="#00F7FF">ACTIVE</text>
      <text x="54" y="132" font-size="8" fill="#4A5B78">distributed · scaling</text>
    </g>

    <!-- DATA MODELING · ACTIVE -->
