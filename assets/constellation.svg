        <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="474" y="237" font-size="11.5" font-weight="600" fill="#EAF6FF">FINE-TUNING</text>
      <text x="474" y="253" font-size="9" letter-spacing="1.5" fill="#E879F9">BUILDING</text>
      <text x="474" y="267" font-size="8" fill="#4A5B78">PEFT · datasets</text>
    </g>

    <!-- EVAL · BENCHMARKS · LEARNING -->
    <g>
      <rect x="460" y="350" width="150" height="64" rx="8" fill="#0A1120" stroke="#7C3AED" stroke-opacity="0.5"/>
      <text x="474" y="372" font-size="11.5" font-weight="600" fill="#EAF6FF">EVAL · BENCHMARKS</text>
      <text x="474" y="388" font-size="9" letter-spacing="1.5" fill="#7C3AED">LEARNING</text>
      <text x="474" y="402" font-size="8" fill="#4A5B78">metrics · evals</text>
    </g>

    <!-- LLMS · ACTIVE -->
