    <rect x="30" y="458" width="596" height="96" rx="10" fill="none" stroke="#16243C" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="44" y="474" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SF Mono',Menlo,monospace" font-size="9" letter-spacing="2" fill="#00F7FF" fill-opacity="0.8">INDOOR NAVIGATION · ACTIVE</text>

