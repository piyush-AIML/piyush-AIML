<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 90" width="100%" role="img" aria-labelledby="sb-title sb-desc">
  <title id="sb-title">Standby — the system quiets, the training continues</title>
  <desc id="sb-desc">A thin dark strip with a slow-moving point on a horizon line — the profile standing by rather than switching off.</desc>

  <rect width="1200" height="90" fill="#000000"/>

  <line x1="100" y1="45" x2="1100" y2="45" stroke="#16243C" stroke-width="1"/>
  <circle cx="300" cy="45" r="2" fill="#16243C"/>
  <circle cx="600" cy="45" r="2" fill="#16243C"/>
  <circle cx="900" cy="45" r="2" fill="#16243C"/>

  <circle r="2.6" fill="#00F7FF">
    <animateMotion path="M100,45 L1100,45" keyPoints="0;1;0" keyTimes="0;0.5;1" dur="24s" repeatCount="indefinite"/>
  </circle>

  <text x="100" y="36" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SF Mono',Menlo,monospace" font-size="13" letter-spacing="3" fill="#00F7FF" fill-opacity="0.85">PIYUSH.AI</text>
  <text x="600" y="36" text-anchor="middle" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SF Mono',Menlo,monospace" font-size="13" letter-spacing="2" fill="#5A6B85">STANDBY — the builder sleeps, the gradients wait</text>
  <text x="1100" y="36" text-anchor="end" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="#3A4A63">REACH VIA GITHUB</text>
</svg>
