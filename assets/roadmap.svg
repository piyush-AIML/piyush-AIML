<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 300" width="100%" role="img" aria-labelledby="rm-title rm-desc">
  <title id="rm-title">Where this is headed — three stages, one pipeline</title>
  <desc id="rm-desc">The plan as a data-flow: finish VLM-1 (magenta), open the lab (violet), learn in public (cyan) — colored stages joined by arrows, async pulses traveling the connections. The work moves forward; the pulse is the motion.</desc>

  <defs>
    <marker id="rm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3A4A63"/>
    </marker>
  </defs>

  <rect width="1000" height="300" fill="#000000"/>

  <text x="40" y="40" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SF Mono',Menlo,monospace" font-size="15" letter-spacing="3" fill="#00F7FF">// WHERE THIS IS HEADED</text>
  <text x="960" y="40" text-anchor="end" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SF Mono',Menlo,monospace" font-size="10" letter-spacing="2" fill="#3A4A63">STAGE 01 → 03 · NO DEADLINES, ONLY LOOP-BACKS</text>

  <g font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SF Mono',Menlo,monospace">

    <!-- connectors -->
    <line x1="356" y1="110" x2="594" y2="110" stroke="#3A4A63" stroke-width="1.5" marker-end="url(#rm-arrow)"/>
    <line x1="356" y1="150" x2="594" y2="150" stroke="#3A4A63" stroke-width="1.5" marker-end="url(#rm-arrow)"/>
    <line x1="356" y1="190" x2="594" y2="190" stroke="#3A4A63" stroke-width="1.5" marker-end="url(#rm-arrow)"/>

    <!-- pulses -->
    <circle r="3" fill="#E879F9">
      <animateMotion path="M356,110 L594,110" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.15;0.4;0.85;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#7C3AED">
      <animateMotion path="M594,150 L356,150" dur="3.4s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.15;0.4;0.85;1" dur="3.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>

    <!-- stage 01 -->
    <g>
      <rect x="40" y="76" width="316" height="148" rx="8" fill="#070A12" stroke="#16243C"/>
      <rect x="40" y="76" width="4" height="148" rx="2" fill="#E879F9">
        <animate attributeName="opacity" values="0.55;1;0.55" dur="3.6s" repeatCount="indefinite"/>
      </rect>
      <text x="64" y="104" font-size="9" letter-spacing="2.5" fill="#3A4A63">STAGE 01</text>
      <text x="64" y="130" font-size="15" font-weight="700" fill="#E879F9">FINISH VLM-1</text>
      <text x="64" y="158" font-size="10.5" fill="#5A6B85">keep the training loop honest</text>
      <text x="64" y="175" font-size="10.5" fill="#5A6B85">and running — model, eval,</text>
      <text x="64" y="192" font-size="10.5" fill="#5A6B85">checkpoints, one commit at a time</text>
      <text x="64" y="212" font-size="9.5" fill="#E879F9" fill-opacity="0.8">state: BUILDING</text>
    </g>

    <!-- stage 02 -->
    <g>
      <rect x="594" y="76" width="316" height="148" rx="8" fill="#070A12" stroke="#16243C"/>
      <rect x="594" y="76" width="4" height="148" rx="2" fill="#7C3AED">
        <animate attributeName="opacity" values="0.55;1;0.55" dur="4.4s" begin="0.9s" repeatCount="indefinite"/>
      </rect>
      <text x="618" y="104" font-size="9" letter-spacing="2.5" fill="#3A4A63">STAGE 02</text>
      <text x="618" y="130" font-size="15" font-weight="700" fill="#7C3AED">OPEN THE LAB</text>
      <text x="618" y="158" font-size="10.5" fill="#5A6B85">publish experiments and</text>
      <text x="618" y="175" font-size="10.5" fill="#5A6B85">notebooks as they happen —</text>
      <text x="618" y="192" font-size="10.5" fill="#5A6B85">raw, honest, in progress</text>
      <text x="618" y="212" font-size="9.5" fill="#7C3AED" fill-opacity="0.8">state: PLANNING</text>
    </g>

    <!-- stage 03 -->
    <g>
      <rect x="40" y="252" width="880" height="26" rx="6" fill="#070A12" stroke="#16243C"/>
      <rect x="40" y="252" width="4" height="26" rx="2" fill="#00F7FF">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
      </rect>
      <text x="64" y="269" font-size="9" letter-spacing="2.5" fill="#3A4A63">STAGE 03</text>
      <text x="160" y="269" font-size="12" font-weight="700" fill="#00F7FF">LEARN IN PUBLIC</text>
      <text x="330" y="269" font-size="10.5" fill="#5A6B85">notes on the from-scratch rebuilds, not summaries of tutorials — the failures are the curriculum</text>
    </g>
  </g>

  <text x="960" y="296" text-anchor="end" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SF Mono',Menlo,monospace" font-size="9" letter-spacing="1" fill="#2A3A55">ship the half-built thing, iterate in public</text>
</svg>
