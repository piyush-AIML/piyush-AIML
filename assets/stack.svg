<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 520" width="100%" role="img" aria-labelledby="st-title st-desc">
  <title id="st-title">Current stack — six domains with honest states</title>
  <desc id="st-desc">The stack as a lab panel: each domain is a colored module — Python backend, system design, LLMs and indoor navigation in active cyan, AI engineering in learning violet, fine-tuning in building magenta — with state chips and skill pills. No percentage bars, because a self-taught skill has no measured width.</desc>

  <rect width="1000" height="520" fill="#000000"/>

  <!-- header -->
  <text x="40" y="40" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SF Mono',Menlo,monospace" font-size="15" letter-spacing="3" fill="#00F7FF">// CURRENT STACK</text>
  <text x="960" y="40" text-anchor="end" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SF Mono',Menlo,monospace" font-size="10" letter-spacing="2" fill="#3A4A63">STATES ARE HONEST · NO PERCENTAGES</text>

  <g font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SF Mono',Menlo,monospace">

    <!-- row: python backend -->
    <g>
      <rect x="40" y="80" width="4" height="54" rx="2" fill="#00F7FF">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/>
      </rect>
      <rect x="40" y="80" width="920" height="54" rx="8" fill="#070A12" stroke="#16243C"/>
      <text x="64" y="103" font-size="13" font-weight="600" fill="#00F7FF">PYTHON BACKEND</text>
      <rect x="64" y="114" width="78" height="18" rx="9" fill="#00F7FF" fill-opacity="0.12" stroke="#00F7FF" stroke-opacity="0.6"/>
      <text x="103" y="127" text-anchor="middle" font-size="9" letter-spacing="1.5" fill="#00F7FF">ACTIVE</text>
      <g font-size="9.5" letter-spacing="0.5">
        <rect x="156" y="114" width="70" height="18" rx="9" fill="#00F7FF" fill-opacity="0.1" stroke="#00F7FF" stroke-opacity="0.35"/><text x="191" y="127" text-anchor="middle" fill="#7FCDD6">FastAPI</text>
        <rect x="234" y="114" width="58" height="18" rx="9" fill="#00F7FF" fill-opacity="0.1" stroke="#00F7FF" stroke-opacity="0.35"/><text x="263" y="127" text-anchor="middle" fill="#7FCDD6">async</text>
        <rect x="300" y="114" width="50" height="18" rx="9" fill="#00F7FF" fill-opacity="0.1" stroke="#00F7FF" stroke-opacity="0.35"/><text x="325" y="127" text-anchor="middle" fill="#7FCDD6">REST</text>
        <rect x="358" y="114" width="110" height="18" rx="9" fill="#00F7FF" fill-opacity="0.1" stroke="#00F7FF" stroke-opacity="0.35"/><text x="413" y="127" text-anchor="middle" fill="#7FCDD6">data &amp; storage</text>
        <rect x="476" y="114" width="90" height="18" rx="9" fill="#3A4A63" fill-opacity="0.2" stroke="#3A4A63" stroke-opacity="0.6"/><text x="521" y="127" text-anchor="middle" fill="#5A6B85">deploy/ops</text>
      </g>
    </g>

    <!-- row: system design -->
    <g>
      <rect x="40" y="150" width="4" height="54" rx="2" fill="#00F7FF">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="5.5s" begin="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="40" y="150" width="920" height="54" rx="8" fill="#070A12" stroke="#16243C"/>
      <text x="64" y="173" font-size="13" font-weight="600" fill="#00F7FF">SYSTEM DESIGN</text>
      <rect x="64" y="184" width="78" height="18" rx="9" fill="#00F7FF" fill-opacity="0.12" stroke="#00F7FF" stroke-opacity="0.6"/>
      <text x="103" y="197" text-anchor="middle" font-size="9" letter-spacing="1.5" fill="#00F7FF">ACTIVE</text>
      <g font-size="9.5" letter-spacing="0.5">
        <rect x="156" y="184" width="100" height="18" rx="9" fill="#00F7FF" fill-opacity="0.1" stroke="#00F7FF" stroke-opacity="0.35"/><text x="206" y="197" text-anchor="middle" fill="#7FCDD6">distributed</text>
        <rect x="264" y="184" width="74" height="18" rx="9" fill="#00F7FF" fill-opacity="0.1" stroke="#00F7FF" stroke-opacity="0.35"/><text x="301" y="197" text-anchor="middle" fill="#7FCDD6">caching</text>
        <rect x="346" y="184" width="66" height="18" rx="9" fill="#00F7FF" fill-opacity="0.1" stroke="#00F7FF" stroke-opacity="0.35"/><text x="379" y="197" text-anchor="middle" fill="#7FCDD6">queues</text>
        <rect x="420" y="184" width="110" height="18" rx="9" fill="#00F7FF" fill-opacity="0.1" stroke="#00F7FF" stroke-opacity="0.35"/><text x="475" y="197" text-anchor="middle" fill="#7FCDD6">data modeling</text>
      </g>
    </g>

    <!-- row: llms -->
    <g>
      <rect x="40" y="220" width="4" height="54" rx="2" fill="#00F7FF">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="4.8s" begin="1.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="40" y="220" width="920" height="54" rx="8" fill="#070A12" stroke="#16243C"/>
      <text x="64" y="243" font-size="13" font-weight="600" fill="#00F7FF">LLMS</text>
      <rect x="64" y="254" width="78" height="18" rx="9" fill="#00F7FF" fill-opacity="0.12" stroke="#00F7FF" stroke-opacity="0.6"/>
      <text x="103" y="267" text-anchor="middle" font-size="9" letter-spacing="1.5" fill="#00F7FF">ACTIVE</text>
      <g font-size="9.5" letter-spacing="0.5">
        <rect x="156" y="254" width="130" height="18" rx="9" fill="#00F7FF" fill-opacity="0.1" stroke="#00F7FF" stroke-opacity="0.35"/><text x="221" y="267" text-anchor="middle" fill="#7FCDD6">RAG &amp; embeddings</text>
        <rect x="294" y="254" width="130" height="18" rx="9" fill="#00F7FF" fill-opacity="0.1" stroke="#00F7FF" stroke-opacity="0.35"/><text x="359" y="267" text-anchor="middle" fill="#7FCDD6">prompt &amp; context</text>
        <rect x="432" y="254" width="64" height="18" rx="9" fill="#3A4A63" fill-opacity="0.2" stroke="#3A4A63" stroke-opacity="0.6"/><text x="464" y="267" text-anchor="middle" fill="#5A6B85">agents</text>
      </g>
    </g>

    <!-- row: ai engineering -->
    <g>
      <rect x="40" y="290" width="4" height="54" rx="2" fill="#7C3AED">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="4.2s" begin="0.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="40" y="290" width="920" height="54" rx="8" fill="#070A12" stroke="#16243C"/>
      <text x="64" y="313" font-size="13" font-weight="600" fill="#7C3AED">AI ENGINEERING</text>
      <rect x="64" y="324" width="88" height="18" rx="9" fill="#7C3AED" fill-opacity="0.15" stroke="#7C3AED" stroke-opacity="0.6"/>
      <text x="108" y="337" text-anchor="middle" font-size="9" letter-spacing="1.5" fill="#7C3AED">LEARNING</text>
      <g font-size="9.5" letter-spacing="0.5">
        <rect x="166" y="324" width="80" height="18" rx="9" fill="#7C3AED" fill-opacity="0.12" stroke="#7C3AED" stroke-opacity="0.4"/><text x="206" y="337" text-anchor="middle" fill="#A78BFA">pipelines</text>
        <rect x="254" y="324" width="110" height="18" rx="9" fill="#7C3AED" fill-opacity="0.12" stroke="#7C3AED" stroke-opacity="0.4"/><text x="309" y="337" text-anchor="middle" fill="#A78BFA">serving &amp; eval</text>
        <rect x="372" y="324" width="62" height="18" rx="9" fill="#3A4A63" fill-opacity="0.2" stroke="#3A4A63" stroke-opacity="0.6"/><text x="403" y="337" text-anchor="middle" fill="#5A6B85">MLOps</text>
      </g>
    </g>

    <!-- row: fine-tuning (the hot one) -->
    <g>
      <rect x="40" y="360" width="4" height="54" rx="2" fill="#E879F9">
        <animate attributeName="opacity" values="0.55;1;0.55" dur="3.6s" repeatCount="indefinite"/>
      </rect>
      <circle r="2.2" fill="#E879F9">
        <animateMotion path="M42,414 L42,360" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1;0.35;0.85;1" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <rect x="40" y="360" width="920" height="54" rx="8" fill="#070A12" stroke="#E879F9" stroke-opacity="0.4">
        <animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3.6s" repeatCount="indefinite"/>
      </rect>
      <text x="64" y="383" font-size="13" font-weight="600" fill="#E879F9">FINE-TUNING</text>
      <rect x="64" y="394" width="90" height="18" rx="9" fill="#E879F9" fill-opacity="0.15" stroke="#E879F9" stroke-opacity="0.65"/>
      <text x="109" y="407" text-anchor="middle" font-size="9" letter-spacing="1.5" fill="#E879F9">BUILDING</text>
      <g font-size="9.5" letter-spacing="0.5">
        <rect x="168" y="394" width="50" height="18" rx="9" fill="#E879F9" fill-opacity="0.12" stroke="#E879F9" stroke-opacity="0.4"/><text x="193" y="407" text-anchor="middle" fill="#F0ABFC">PEFT</text>
        <rect x="226" y="394" width="74" height="18" rx="9" fill="#E879F9" fill-opacity="0.12" stroke="#E879F9" stroke-opacity="0.4"/><text x="263" y="407" text-anchor="middle" fill="#F0ABFC">datasets</text>
        <rect x="308" y="394" width="130" height="18" rx="9" fill="#E879F9" fill-opacity="0.12" stroke="#E879F9" stroke-opacity="0.4"/><text x="373" y="407" text-anchor="middle" fill="#F0ABFC">eval &amp; benchmarks</text>
      </g>
    </g>

    <!-- row: indoor navigation -->
    <g>
      <rect x="40" y="430" width="4" height="54" rx="2" fill="#00F7FF">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="5.2s" begin="2s" repeatCount="indefinite"/>
      </rect>
      <rect x="40" y="430" width="920" height="54" rx="8" fill="#070A12" stroke="#16243C"/>
      <text x="64" y="453" font-size="13" font-weight="600" fill="#00F7FF">INDOOR NAVIGATION</text>
      <rect x="64" y="464" width="78" height="18" rx="9" fill="#00F7FF" fill-opacity="0.12" stroke="#00F7FF" stroke-opacity="0.6"/>
      <text x="103" y="477" text-anchor="middle" font-size="9" letter-spacing="1.5" fill="#00F7FF">ACTIVE</text>
      <g font-size="9.5" letter-spacing="0.5">
        <rect x="156" y="464" width="50" height="18" rx="9" fill="#00F7FF" fill-opacity="0.1" stroke="#00F7FF" stroke-opacity="0.35"/><text x="181" y="477" text-anchor="middle" fill="#7FCDD6">SLAM</text>
        <rect x="214" y="464" width="100" height="18" rx="9" fill="#00F7FF" fill-opacity="0.1" stroke="#00F7FF" stroke-opacity="0.35"/><text x="264" y="477" text-anchor="middle" fill="#7FCDD6">sensor fusion</text>
        <rect x="322" y="464" width="110" height="18" rx="9" fill="#00F7FF" fill-opacity="0.1" stroke="#00F7FF" stroke-opacity="0.35"/><text x="377" y="477" text-anchor="middle" fill="#7FCDD6">path planning</text>
        <rect x="440" y="464" width="74" height="18" rx="9" fill="#00F7FF" fill-opacity="0.1" stroke="#00F7FF" stroke-opacity="0.35"/><text x="477" y="477" text-anchor="middle" fill="#7FCDD6">mapping</text>
      </g>
    </g>
  </g>

  <!-- legend -->
  <g font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'SF Mono',Menlo,monospace" font-size="10" letter-spacing="2">
    <rect x="40" y="500" width="10" height="10" fill="#00F7FF"/>
    <text x="58" y="509" fill="#5A6B85">ACTIVE</text>
    <rect x="130" y="500" width="10" height="10" fill="#7C3AED"/>
    <text x="148" y="509" fill="#5A6B85">LEARNING</text>
    <rect x="230" y="500" width="10" height="10" fill="#E879F9"/>
    <text x="248" y="509" fill="#5A6B85">BUILDING</text>
    <rect x="330" y="500" width="10" height="10" fill="#3A4A63"/>
    <text x="348" y="509" fill="#5A6B85">EXPLORING</text>
    <text x="960" y="509" text-anchor="end" font-size="9" letter-spacing="1" fill="#2A3A55">a skill has no measured width until it's shipped</text>
  </g>
</svg>
