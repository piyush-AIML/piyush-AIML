name: Telemetry Refresh

on:
  schedule:
    - cron: "23 4 * * *"   # daily, off-peak minute — one commit per day, never spam
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate contribution energy field
        run: python .github/scripts/generate_telemetry.py --user piyush-AIML --out assets/generated/contributions.svg

      - name: Commit if changed
        run: |
          git config user.name "piyush-AIML"
          git config user.email "piyush-AIML@users.noreply.github.com"
          git add assets/generated/contributions.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh contribution telemetry [daily]"
            git push
          else
            echo "no change since last sync — nothing to commit"
          fi
